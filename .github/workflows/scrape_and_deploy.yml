name: Scrape Jobs and Deploy Dashboard

on:
  schedule:
    # ----------------------------------------------------
    # [운영 스케줄 (KST 기준)]
    # - 스크랩: 아침 09:00 (UTC 00:00), 밤 21:00 (UTC 12:00)
    # - 알림:   아침 09:05 (UTC 00:05), 밤 21:05 (UTC 12:05)
    # ----------------------------------------------------
    # [운영용 주석 - 테스트 완료 후 아래 4줄의 주석을 풀고 테스트용을 주석 처리하세요]
    # - cron: '0 0 * * *'    # 운영: 아침 09:00 스크랩
    # - cron: '5 0 * * *'    # 운영: 아침 09:05 알림
    # - cron: '0 12 * * *'   # 운영: 밤 21:00 스크랩
    # - cron: '5 12 * * *'   # 운영: 밤 21:05 알림

    # [12시 테스트용 스케줄 (KST 12:00 / 12:05 -> UTC 03:00 / 03:05)]
    - cron: '0 3 * * *'      # 테스트: 12:00 스크랩
    - cron: '5 3 * * *'      # 테스트: 12:05 알림

  workflow_dispatch:
    inputs:
      action_type:
        description: '실행 모드 선택 (scrape / notify)'
        required: true
        default: 'scrape'
        type: choice
        options:
          - scrape
          - notify

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    outputs:
      action_type: ${{ steps.mode.outputs.action_type }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------
      # 실행 모드 판별: 매시 5분 트리거는 notify, 그 외는 scrape
      # ----------------------------------------------------
      - name: Determine Action Type
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action_type=${{ inputs.action_type }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.schedule }}" =~ ^5\  ]]; then
            echo "action_type=notify" >> $GITHUB_OUTPUT
          else
            echo "action_type=scrape" >> $GITHUB_OUTPUT
          fi

      # ----------------------------------------------------
      # 모드 1: 수집 및 대시보드 갱신
      # ----------------------------------------------------
      - name: Run Scraping
        if: steps.mode.outputs.action_type == 'scrape'
        run: |
          python main.py scrape

      # ----------------------------------------------------
      # 모드 2: 텔레그램 알림 발송
      # ----------------------------------------------------
      - name: Send Daily Telegram Notification
        if: steps.mode.outputs.action_type == 'notify'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: "https://yeoltong.site"
        run: |
          python main.py notify

      # ----------------------------------------------------
      # 데이터 변경사항 커밋
      # ----------------------------------------------------
      - name: Commit and Push Updated Data
        if: steps.mode.outputs.action_type == 'scrape'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: update job data [skip ci]"
            git push
          fi

      # ----------------------------------------------------
      # GitHub Pages 산출물 빌드 및 업로드
      # ----------------------------------------------------
      - name: Prepare Web Build Artifact
        if: steps.mode.outputs.action_type == 'scrape'
        run: |
          mkdir -p public
          cp -r web/* public/
          mkdir -p public/data
          cp data/jobs.json public/data/jobs.json
          echo "yeoltong.site" > public/CNAME

      - name: Upload Pages Artifact
        if: steps.mode.outputs.action_type == 'scrape'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: run-pipeline
    if: needs.run-pipeline.outputs.action_type == 'scrape'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4