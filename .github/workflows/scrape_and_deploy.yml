name: Scrape Jobs and Deploy Dashboard

on:
  schedule:
    # UTC 00:00 (한국시간 09:00), UTC 12:00 (한국시간 21:00)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 지원

permissions:
  contents: write # history.json 및 jobs.json 자동 커밋 권한
  pages: write    # GitHub Pages 배포 권한
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraping Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 텔레그램 버튼에 연결될 도메인 (사용할 서브도메인으로 수정)
          DASHBOARD_URL: "https://yeoltong.site"
        run: |
          python main.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/jobs.json
          if git diff --staged --quiet; then
            echo "수집 데이터 변경 사항이 없어 커밋을 건너뜁니다."
          else
            git commit -m "chore: update job postings data [skip ci]"
            git push
          fi

      - name: Prepare Web Build Artifact
        run: |
          mkdir -p public
          cp -r web/* public/
          mkdir -p public/data
          cp data/jobs.json public/data/jobs.json
          
          # Pages 배포 시 CNAME 유지 (사용할 서브도메인 입력)
          echo "qa.yourdomain.com" > public/CNAME

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4